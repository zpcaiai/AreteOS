name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a production migration midway. Pull-request checks remain
  # replaceable, while main-branch pushes are serialized in commit order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast required gate — pure type & unit checks, no database needed.
  typecheck-test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:clinical
      - run: npm audit --omit=dev --audit-level=moderate --registry=https://registry.npmjs.org
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: ci-sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

  # Full build — validates that every tracked migration applies and Next builds.
  build:
    name: Migrate & build
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mission_os"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mission_os
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mission_os
      AI_PROVIDER: mock
      AUTH_SECRET: ci-not-a-real-secret-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PersonalMemory.embedding needs the pgvector extension before migrations run.
      - name: Enable pgvector
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mission_os -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: npm run db:migrate:deploy
      - run: npm run db:migrate:status
      - name: Verify critical production tables
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mission_os -v ON_ERROR_STOP=1 -c "SELECT 1 FROM users, auth_sessions, rate_limit_buckets, foundry_workspaces, registration_invites, guardian_consents, security_audit_events, workspace_template_feedback LIMIT 0"
      - run: npm run build

  # End-to-end smoke tests. Runs the app against a seeded database.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mission_os"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mission_os
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mission_os
      AI_PROVIDER: mock
      AUTH_SECRET: ci-not-a-real-secret-at-least-32-characters
      DEV_USER_ID: usr_demo
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable pgvector
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d mission_os -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run E2E
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start

  # Production schema deployment. This runs only after every release gate has
  # passed for a push to main; pull requests never receive production secrets.
  deploy-neon:
    name: Deploy migrations to Neon
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck-test, build, e2e]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    env:
      # Prisma Migrate must use Neon's direct (non-pooler) connection. Setting
      # both values keeps Prisma 6 and future config resolution deterministic.
      DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate migration secret
        run: >-
          node -e 'const value = process.env.DIRECT_URL;
          if (!value) throw new Error("NEON_DIRECT_URL is missing");
          const url = new URL(value);
          if (url.hostname.includes("-pooler"))
          throw new Error("NEON_DIRECT_URL must use a non-pooled Neon hostname");'
      - name: Refuse an unbaselined legacy database
        shell: bash
        run: |
          printf '%s\n' \
            'DO $$ BEGIN IF to_regclass('"'"'public._prisma_migrations'"'"') IS NULL AND to_regclass('"'"'public.users'"'"') IS NOT NULL THEN RAISE EXCEPTION '"'"'Legacy database has no Prisma migration baseline; follow docs/neon-auto-migrate.md'"'"'; END IF; END $$;' \
            | npx prisma db execute --url "$DIRECT_URL" --stdin
      - name: Apply pending migrations
        run: npm run db:migrate:deploy
      - name: Verify migration state
        run: npm run db:migrate:status
      - name: Verify critical production tables
        shell: bash
        run: |
          printf '%s\n' 'SELECT 1 FROM users, auth_sessions, rate_limit_buckets, foundry_workspaces, registration_invites, guardian_consents, security_audit_events, workspace_template_feedback LIMIT 0;' \
            | npx prisma db execute --url "$DIRECT_URL" --stdin

  # Vercel's Git integration is intentionally disconnected. Only a commit that
  # passed CI, E2E, and the Neon migration may become a production candidate.
  deploy-production:
    name: Deploy, verify & promote production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-neon]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Vercel release credentials
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$PRODUCTION_URL"
      - name: Load production project settings
        run: npx vercel@56.3.1 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Create unaliased production candidate
        id: candidate
        shell: bash
        run: |
          url="$(npx vercel@56.3.1 deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA" --build-env APP_VERSION="$GITHUB_SHA" --env APP_VERSION="$GITHUB_SHA")"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify protected candidate health
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        shell: bash
        run: |
          body="$(npx vercel@56.3.1 curl /api/health --deployment "$CANDIDATE_URL" --token "$VERCEL_TOKEN" -- --fail-with-body --silent --show-error)"
          BODY="$body" node -e 'const health=JSON.parse(process.env.BODY); if(health.status!=="ready") throw new Error(JSON.stringify(health));'
          npx vercel@56.3.1 curl /privacy --deployment "$CANDIDATE_URL" --token "$VERCEL_TOKEN" -- --fail --silent --show-error >/dev/null
          npx vercel@56.3.1 curl /terms --deployment "$CANDIDATE_URL" --token "$VERCEL_TOKEN" -- --fail --silent --show-error >/dev/null
          npx vercel@56.3.1 curl /login --deployment "$CANDIDATE_URL" --token "$VERCEL_TOKEN" -- --fail --silent --show-error >/dev/null
      - name: Promote verified candidate
        run: npx vercel@56.3.1 promote "${{ steps.candidate.outputs.url }}" --yes --token "$VERCEL_TOKEN"
      - name: Verify canonical production and commit
        run: npm run smoke:production
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: production-sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
      - name: Close recovered release incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue="$(gh issue list --label production-release --state open --search 'Production release pipeline is blocked in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$issue" ]; then gh issue close "$issue" --comment "Production release recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."; fi
      - name: Open or update release incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create production-release --color B60205 --description "Automated production release blocker" --force
          issue="$(gh issue list --label production-release --state open --search 'Production release pipeline is blocked in:title' --json number --jq '.[0].number // empty')"
          body="Production release failed closed at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Commit: ${GITHUB_SHA}. No failed candidate was promoted."
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title "Production release pipeline is blocked" --label production-release --body "$body"; fi
